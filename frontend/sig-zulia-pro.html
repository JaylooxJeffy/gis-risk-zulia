<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://*.tile.openstreetmap.org https://geocode-api.arcgis.com data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; connect-src 'self' https://geocode-api.arcgis.com https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com http://localhost:3000 https://rest.isric.org https://power.larc.nasa.gov https://api.opentopodata.org https://overpass-api.de https://firms.modaps.eosdis.nasa.gov https://api.gis-risk.dev;">
    <title>Sistema GIS Profesional - Estado Zulia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="sig-pro-styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>
    <div class="container">
        <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="closeSidebar()"></div>
        <header>
            <div class="header-content">
                <button id="sidebarToggleBtn" class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Abrir filtros">☰</button>
                <div class="logo-section">
                    <div class="logo-icon">🗺️</div>
                    <div>
                        <h1>Sistema de Información Geográfica</h1>
                        <p class="subtitle">Análisis de Zonas de Riesgo — Estado Zulia y cobertura mundial</p>
                    </div>
                </div>
                <div class="user-section">
                    <div class="user-info">
                        <span class="user-name" id="username-display">Usuario</span>
                        <span class="user-role" id="role-display">Consultor</span>
                    </div>
                    <div class="header-actions">
                        <button class="btn-admin" id="btn-admin-panel" style="display: none;" onclick="goToAdminPanel()">
                            ⚙️ Panel Admin
                        </button>
                        <button class="btn-admin" id="btn-analista-panel" style="display: none;" onclick="goToAnalistaPanel()">
                            📊 Mi Panel
                        </button>
                        <button class="btn-logout" onclick="handleLogout()">Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="search-panel">
                <button class="sidebar-close-btn" onclick="closeSidebar()" aria-label="Cerrar filtros">✕</button>
                <div class="search-section">
                    <h2>🔍 Búsqueda de Ubicación</h2>
                    <div class="search-input-wrapper">
                        <span class="search-icon">📍</span>
                        <input type="text" id="locationSearch" class="search-input" placeholder="Buscar ubicación en Zulia...">
                        <div id="locationDropdown" class="location-dropdown"></div>
                    </div>
                </div>

                <div class="filters-section">
                    <div class="filter-group accordion-group" id="riskGroup"></div>
                    <div class="filter-group accordion-group" id="severityGroup"></div>
                    <div class="filter-group accordion-group" id="impactGroup"></div>

                    <div id="selectedFiltersSection" class="selected-filters-section" style="display: none;">
                        <label class="filter-label">Filtros Activos</label>
                        <div id="selectedTags" class="selected-tags-container"></div>
                    </div>
                </div>

                <button class="analyze-btn" onclick="analyzeRisks()" id="analyzeBtn" disabled>
                    📊 Analizar Zona de Riesgo
                </button>
            </div>

            <div class="map-container">
                <div id="map"></div>
                <div class="legend">
                    <h4>📊 Leyenda del Mapa</h4>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #dc2626;"></div>
                        <span>Riesgo Muy Alto</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #d97706;"></div>
                        <span>Riesgo Alto</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #f59e0b;"></div>
                        <span>Riesgo Moderado</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #059669;"></div>
                        <span>Riesgo Bajo</span>
                    </div>
                </div>
                <div id="resultsPanel" class="results-panel">
                    <div class="results-header">
                        <h3>📋 Resultados del Análisis</h3>
                        <button class="close-btn" onclick="closeResults()">×</button>
                    </div>
                    <div id="resultsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script src="validacion-cientifica.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="exportar-reportes.js"></script>
    <script src="config.js"></script>
    <script src="sig-pro.js"></script>
</body>
</html>
